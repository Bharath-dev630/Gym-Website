<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/images/logo1.png" type="image/x-icon">
  <title>Gym Login | B-Fit</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to right, #0a0a0a, #1a1a1a);
      color: #fff;
      background-image: url(/images/36th.jpeg);
    }
    /* ============== NAVBAR ============= */
.navbar {
    min-height: 55px;
    background: rgba(13, 110, 253, 0.97) !important;
    box-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
}
.logo {
    width: 50px;
    height: 55px;
    object-fit: contain;
    border-radius: 50px;
}
.navbar-nav {
    gap: 5px;
}
.nav-item {
    font-size: 16px;
    font-weight: 450;
}
.nav-link {
    color: #ffffff !important;
    padding: 10px 14px !important;
    border-radius: 25px;
    transition: all 0.3s ease;
}
.nav-link:hover,.nav-link.active {
    background-color: #000000;
    color: #ffffff !important;
}
.dropdown-menu {
    background-color: #ffffff;
    border: none;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
}
.dropdown-item {
    padding: 10px 18px;
    font-weight: 500;
}
.dropdown-item:hover {
    background-color: #dc3545;
    color: #ffffff;
}
/* Join Button */

.join-btn {
    display: inline-block;
    background-color: #dc3545;
    color: #ffffff;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
    transition: all 0.3s ease;
}
.join-btn:hover {
    background-color: #a71d2a;
    color: #ffffff;
    transform: translateY(-2px);
} 
 .container1{
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Poppins', sans-serif; 
    min-height: 30vh
  }
  .login-card {
      background: #1e1e1e;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(196, 16, 16, 0.516);
      padding: 40px 30px;
      width: 100%;
      min-width: none;
      max-width: 420px;
  }
  .login-card h3 {
      font-weight: 700;
      text-align: center;
      margin-bottom: 25px;
      color: #f8f9fa;
  }
  .form-control {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
  }
  .form-control:focus {
      background: #2a2a2a;
      color: #fff;
      border-color: #ff4757;
      box-shadow: none;
  }
  .btn-login {
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      width: 100%;
      font-weight: 600;
      transition: 0.3s;
  }
  .btn-login:hover {
      background: #e84118;
  }
  .text-link a {
      color: #ff4757;
      text-decoration: none;
  }
  .text-link a:hover {
      text-decoration: underline;
  }
  .social-icons a {
      font-size: 22px;
      margin: 0 8px;
      color: #ff4757;
      transition: 0.3s;
  }
  .social-icons a:hover {
      color: #fff;
  }

    @media (min-width:300px) and (max-width: 576px) {
      .login-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>
<!-- ================= NAVBAR ================= -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container"><a class="navbar-brand" href="index.html">
    <img src="/images/logo1.png" class="logo" alt="B-Fit Gym Logo"> </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
    data-bs-target="#navbarNav"
    aria-controls="navbarNav"
    aria-expanded="false"
    aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav ms-auto align-items-lg-center"><li class="nav-item">
        <a class="nav-link active" href="index.html">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="about_us.html">About Us</a></li>
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="branches.html" role="button"
          data-bs-toggle="dropdown" aria-expanded="false"> Branches </a>
        <ul class="dropdown-menu">
          <li> <a class="dropdown-item" href="branches.html"> Hyderabad </a></li>
        </ul>
      </li>
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
          aria-expanded="false">Gallery</a>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="gallaryimages.html"> Images </a></li>
          <li> <a class="dropdown-item" href="gallaryimages.html"> Videos </a></li>
        </ul>
      </li>
      <li class="nav-item"> <a class="nav-link" href="membership.html">Membership</a></li>
      <li class="nav-item"> <a class="nav-link" href="freepass.html">Free Pass</a></li>
      <li class="nav-item ms-lg-3 mt-2 mt-lg-0"><a href="login.html" class="join-btn">
          Join Today</a></li>
    </ul>
  </div>
</div>
</nav>

<div class="container1 pt-5 ms-5 mt-5 mx-auto" style="display: flex;">
  <div class="login-card">
    <h3><i class="bi bi-dumbbell me-2"></i>B-Fit Gym Login</h3>

    <form action="#" method="post">
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="remember">
        <label class="form-check-label" for="remember">Remember me</label>
      </div>

      <button type="submit" class="btn-login">Login</button>

      <div class="text-center mt-3 text-link">
        <p>Don't have an account? <a href="registration.html">Register</a></p>
        <p><a href="#">Forgot Password?</a></p>
      </div>

      <div class="text-center mt-4 social-icons">
        <p>Or login with</p>
        <a href="#"><i class="bi bi-facebook"></i></a>
        <a href="#"><i class="bi bi-google"></i></a>
        <a href="#"><i class="bi bi-instagram"></i></a>
      </div>
    </form>
  </div>
</div>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
